name: flutter_network_diagnostics
description: A production-grade network observability, DNS resolution, and TCP/TLS latency diagnostics suite built with Flutter Bloc & Cubit.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  connectivity_plus: ^6.0.5
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.7
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
